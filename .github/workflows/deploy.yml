name: Deploy Astro Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Keeps the contribution calendar and language stats on stats.astro fresh
    # even on days with no commit to this repo. Times are UTC.
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_STATS_PRIVATE_TOKEN: ${{ secrets.GH_STATS_PRIVATE_TOKEN }}
          GH_STATS_SHOWCASE_REPOS: ${{ vars.GH_STATS_SHOWCASE_REPOS }}
        run: node scripts/fetch-github-stats.mjs

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
